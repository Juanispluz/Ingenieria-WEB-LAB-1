<text x="65" y="124" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Inicio  |  Acerca de  |  Registro  |  Servicios</text>
<rect x="50" y="175" width="185" height="71" rx="0" fill="#ffffff" stroke="#444444" stroke-width="1.1"/>
<rect x="50" y="175" width="185" height="26" rx="0" fill="#ececec" stroke="#444444" stroke-width="1.1"/>
<text x="60" y="192" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Nodo Acerca de</text>
<text x="60" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">GET /acerca</text>
<text x="60" y="233" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">acerca.html</text>
<rect x="300" y="175" width="400" height="71" rx="0" fill="#ffffff" stroke="#444444" stroke-width="1.1"/>
<rect x="300" y="175" width="400" height="26" rx="0" fill="#ececec" stroke="#444444" stroke-width="1.1"/>
<text x="310" y="192" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Nodo Inicio</text>
<text x="310" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">GET /  →  index.html</text>
<text x="310" y="233" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Enlace: «Registro» → Nodo Registro</text>
<rect x="300" y="275" width="400" height="88" rx="0" fill="#ffffff" stroke="#444444" stroke-width="1.1"/>
<rect x="300" y="275" width="400" height="26" rx="0" fill="#ececec" stroke="#444444" stroke-width="1.1"/>
<text x="310" y="292" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Nodo Registro</text>
<text x="310" y="316" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">GET /registro  →  registro.html</text>
<text x="310" y="333" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Formulario: nombre, correo, teléfono</text>
<text x="310" y="350" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Acción: «Registrarme» → POST /huespedes</text>
<rect x="300" y="400" width="400" height="71" rx="0" fill="#ffffff" stroke="#444444" stroke-width="1.1"/>
<rect x="300" y="400" width="400" height="26" rx="0" fill="#ececec" stroke="#444444" stroke-width="1.1"/>
<text x="310" y="417" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Respuesta: Registro completado (201)</text>
<text x="310" y="441" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Muestra el id_huesped que generó SQLite</text>
<text x="310" y="458" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Enlace: «Ir a solicitar la reserva» → Nodo Servicios</text>
<rect x="300" y="510" width="400" height="88" rx="0" fill="#ffffff" stroke="#444444" stroke-width="1.1"/>
<rect x="300" y="510" width="400" height="26" rx="0" fill="#ececec" stroke="#444444" stroke-width="1.1"/>
<text x="310" y="527" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Nodo Servicios</text>
<text x="310" y="551" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">GET /servicios  →  servicios.html</text>
<text x="310" y="568" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Servicios, tarifas y formulario de reserva</text>
<text x="310" y="585" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Acción: «Reservar» → POST /reservas</text>
<rect x="300" y="640" width="400" height="71" rx="0" fill="#ffffff" stroke="#444444" stroke-width="1.1"/>
<rect x="300" y="640" width="400" height="26" rx="0" fill="#ececec" stroke="#444444" stroke-width="1.1"/>
<text x="310" y="657" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Respuesta: Reserva registrada (201)</text>
<text x="310" y="681" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Muestra id_reserva, huesped_id, fecha, noches, personas</text>
<text x="310" y="698" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Enlace: «Registrar otra reserva» → Nodo Servicios</text>
<rect x="760" y="275" width="250" height="71" rx="0" fill="#ffffff" stroke="#444444" stroke-width="1.1"/>
<rect x="760" y="275" width="250" height="26" rx="0" fill="#ececec" stroke="#444444" stroke-width="1.1"/>
<text x="770" y="292" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Respuesta: Datos incompletos (400)</text>
<text x="770" y="316" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">No se ejecuta el INSERT</text>
<text x="770" y="333" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Enlace: «Volver al registro»</text>
<rect x="760" y="510" width="250" height="88" rx="0" fill="#ffffff" stroke="#444444" stroke-width="1.1"/>
<rect x="760" y="510" width="250" height="26" rx="0" fill="#ececec" stroke="#444444" stroke-width="1.1"/>
<text x="770" y="527" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Respuesta: error en la reserva (400)</text>
<text x="770" y="551" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Datos incompletos o no numéricos</text>
<text x="770" y="568" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Huésped no encontrado</text>
<text x="770" y="585" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Enlace: «Volver a servicios»</text>
