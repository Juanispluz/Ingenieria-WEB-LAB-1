<path d="M278,134 V555 H300" fill="none" stroke="#444444" stroke-width="1.1" marker-end="url(#pf)"/>
<line x1="500" y1="247" x2="500" y2="275" stroke="#444444" stroke-width="1.1" marker-end="url(#pf)"/>
<text x="510" y="266" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#555555" xml:space="preserve" text-anchor="start">registrarse</text>
<line x1="500" y1="364" x2="500" y2="400" stroke="#444444" stroke-width="1.1" marker-end="url(#pf)"/>
<text x="510" y="386" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#555555" xml:space="preserve" text-anchor="start">registrar  →  POST /huespedes</text>
<line x1="500" y1="472" x2="500" y2="510" stroke="#444444" stroke-width="1.1" marker-end="url(#pf)"/>
<text x="510" y="495" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#555555" xml:space="preserve" text-anchor="start">ir a solicitar la reserva (lleva el id_huesped)</text>
<line x1="500" y1="599" x2="500" y2="640" stroke="#444444" stroke-width="1.1" marker-end="url(#pf)"/>
<text x="510" y="624" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#555555" xml:space="preserve" text-anchor="start">reservar  →  POST /reservas</text>
<line x1="700" y1="300" x2="760" y2="300" stroke="#444444" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#pf)"/>
<text x="722" y="294" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#555555" xml:space="preserve" text-anchor="start">400</text>
<line x1="700" y1="535" x2="760" y2="535" stroke="#444444" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#pf)"/>
<text x="722" y="529" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#555555" xml:space="preserve" text-anchor="start">400</text>
<path d="M700,676 H736 V572 H700" fill="none" stroke="#444444" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#pf)"/>
<rect x="50" y="755" width="960" height="88" rx="0" fill="#ffffff" stroke="#444444" stroke-width="1.1"/>
<rect x="50" y="755" width="960" height="26" rx="0" fill="#ececec" stroke="#444444" stroke-width="1.1"/>
<text x="60" y="772" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Cómo se conserva el identificador durante el recorrido</text>
<text x="60" y="796" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">El nodo «Registro completado» muestra el id que devolvió lastInsertRowid.</text>
<text x="60" y="813" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">El usuario anota ese número y lo escribe en el campo «Número de huésped» del nodo Servicios.</text>
<text x="60" y="830" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">No hay sesión ni cookies: el identificador viaja dentro del cuerpo del POST /reservas.</text>
<text x="50" y="875" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#555555" xml:space="preserve" text-anchor="start">Línea continua: enlace o acción del usuario.     Línea punteada: respuesta de error o retorno.</text>
</svg>
