<text x="525.0" y="54" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555555" xml:space="preserve" text-anchor="middle">¿Qué nodos visita el usuario y cómo se desplaza entre ellos?</text>
<rect x="50" y="86" width="950" height="48" rx="0" fill="#ececec" stroke="#444444" stroke-width="1.1"/>
