<rect x="0" y="0" width="1070" height="750" fill="#ffffff"/>
<text x="535.0" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" xml:space="preserve" text-anchor="middle">OOHDM · 3. Diseño de interfaz abstracta — Hotel Las Palmas</text>
<text x="535.0" y="54" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#555555" xml:space="preserve" text-anchor="middle">¿Qué información, controles y respuestas contiene cada nodo?</text>
<rect x="50" y="80" width="20" height="14" rx="0" fill="#ffffff" stroke="#444444" stroke-width="1.1"/>
