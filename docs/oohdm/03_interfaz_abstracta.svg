<rect x="255" y="80" width="20" height="14" rx="0" fill="#f4f4f4" stroke="#444444" stroke-width="1.1"/>
<text x="282" y="91" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#555555" xml:space="preserve" text-anchor="start">Campo de entrada</text>
<rect x="450" y="80" width="20" height="14" rx="0" fill="#ffffff" stroke="#444444" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="477" y="91" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#555555" xml:space="preserve" text-anchor="start">Dato conservado</text>
<rect x="645" y="80" width="20" height="14" rx="0" fill="#3a3a3a" stroke="#444444" stroke-width="1.1"/>
