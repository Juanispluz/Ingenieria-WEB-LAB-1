<text x="50" y="601" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Clase Huésped      -&gt;  tabla huespedes     -&gt;  POST /huespedes  -&gt;  INSERT INTO huespedes</text>
