<text x="50" y="633" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Nodo Registro      -&gt;  GET /registro       -&gt;  registro.html    -&gt;  formulario del huésped</text>
<text x="50" y="649" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Nodo Servicios     -&gt;  GET /servicios      -&gt;  servicios.html   -&gt;  formulario de la reserva</text>
<text x="50" y="665" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Relación 1 a 0..*  -&gt;  columna huesped_id  -&gt;  SELECT id FROM huespedes WHERE id = ?</text>
