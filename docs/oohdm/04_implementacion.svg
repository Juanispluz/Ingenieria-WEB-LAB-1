<text x="436" y="265" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">GET  /             -&gt;  index.html</text>
<text x="436" y="281" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">GET  /acerca       -&gt;  acerca.html</text>
<text x="436" y="297" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">GET  /registro     -&gt;  registro.html</text>
<text x="436" y="313" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">GET  /servicios    -&gt;  servicios.html</text>
<text x="436" y="329" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">GET  /styles.css   -&gt;  styles.css</text>
<text x="436" y="345" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">POST /huespedes    -&gt;  INSERT huespedes</text>
<text x="436" y="361" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">POST /reservas     -&gt;  INSERT reservas</text>
<text x="436" y="377" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">cualquier otra     -&gt;  404</text>
<text x="422" y="407" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Valida los campos y responde 400 si falta alguno.</text>
<text x="422" y="424" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">Responde 201 y el id cuando el INSERT sale bien.</text>
<text x="422" y="441" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a" xml:space="preserve" text-anchor="start">La función pagina() arma el HTML de cada respuesta.</text>
